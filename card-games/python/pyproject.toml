[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gostop"
version = "0.1.0"
description = "화투 고스톱(맞고) 룰 엔진과 CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["hwatu", "gostop", "godori", "card-game", "game-engine"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Topic :: Games/Entertainment :: Board Games",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
gostop = "gostop.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gostop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
