<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고스톱</title>
<style>
  :root{
    --mat:#123a2c; --mat-2:#0c2a1f; --mat-line:#1d5340;
    --tile:#f3ead7; --tile-edge:#cbbb9a; --ink:#17130f;
    --vermilion:#c4372b; --indigo:#2a4a8c; --ochre:#c2932c; --moss:#4a6b45;
    --dim:#8ba898;
    --kr: "Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
    --mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:14px; font-family:var(--kr); color:var(--tile);
    background:
      radial-gradient(ellipse at 50% -10%, #1a4d3a 0%, transparent 62%),
      var(--mat);
    background-color:var(--mat);
  }
  .wrap{max-width:760px;margin:0 auto}

  /* ── 상단 계기판 ── */
  .bar{
    display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
    padding-bottom:10px;border-bottom:1px solid var(--mat-line);margin-bottom:14px;
  }
  .brand{font-size:19px;font-weight:800;letter-spacing:-.02em}
  .brand em{font-style:normal;color:var(--ochre)}
  .stat{font-family:var(--mono);font-size:12px;color:var(--dim);margin-left:auto}
  .stat b{color:var(--tile);font-weight:600}

  /* ── 진영 ── */
  .side{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:9px 11px;border:1px solid var(--mat-line);border-radius:8px;
    background:var(--mat-2);margin-bottom:12px;
  }
  .side.active{border-color:var(--ochre)}
  .who{font-size:12px;font-weight:700;letter-spacing:.06em}
  .pts{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--ochre);line-height:1}
  .tally{display:flex;gap:9px;font-family:var(--mono);font-size:11px;color:var(--dim)}
  .tally b{color:var(--tile);font-weight:600}

  /* ── 바닥 ── */
  .field-label{font-size:11px;letter-spacing:.14em;color:var(--dim);margin:0 0 7px}
  .field{
    display:flex;flex-wrap:wrap;gap:6px;min-height:96px;
    padding:10px;border-radius:9px;
    background:
      repeating-linear-gradient(45deg,transparent,transparent 7px,rgba(255,255,255,.014) 7px,rgba(255,255,255,.014) 14px),
      var(--mat-2);
    border:1px solid var(--mat-line);
  }
  .field:empty::after{content:"바닥이 비었습니다";color:var(--dim);font-size:12px}

  /* ── 카드 ── */
  .card{
    position:relative;width:56px;height:84px;flex:0 0 auto;
    border-radius:5px;overflow:hidden;background:var(--tile);
    box-shadow:0 2px 0 var(--tile-edge);cursor:default;user-select:none;
  }
  .card svg{display:block;width:100%;height:100%}
  .card[data-k="gwang"]{box-shadow:0 2px 0 var(--ochre)}
  .hand .card{cursor:pointer;transition:transform .12s ease}
  .hand .card:hover,.hand .card:focus-visible{transform:translateY(-7px)}
  .hand .card:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
  .card.pick{cursor:pointer;animation:throb 1s ease-in-out infinite}
  .card.hint::before{
    content:"";position:absolute;inset:-3px;border:1.5px dashed var(--ochre);border-radius:7px
  }
  @keyframes throb{50%{box-shadow:0 0 0 3px var(--ochre)}}
  @keyframes drop{from{transform:translateY(-16px) rotate(-4deg);opacity:0}}
  .card.new{animation:drop .22s ease-out}

  /* ── 손패 ── */
  .hand{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0 2px;min-height:90px}

  /* ── 도장: 이 화면의 시그니처 ── */
  .seal{
    position:fixed;left:50%;top:42%;translate:-50% -50%;z-index:40;pointer-events:none;
    background:var(--vermilion);color:#fff;font-weight:800;font-size:30px;
    letter-spacing:.1em;padding:16px 20px;border-radius:6px;
    border:2.5px solid rgba(255,255,255,.5);
    animation:stamp .55s cubic-bezier(.2,1.6,.4,1) forwards;
  }
  @keyframes stamp{
    0%{scale:2.2;rotate:-14deg;opacity:0}
    35%{scale:1;rotate:-6deg;opacity:1}
    75%{opacity:1}
    100%{opacity:0;scale:1.04}
  }

  /* ── 조작 ── */
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
  button{
    font-family:var(--kr);font-size:13px;font-weight:700;
    padding:9px 15px;border-radius:6px;border:1px solid var(--mat-line);
    background:var(--mat-2);color:var(--tile);cursor:pointer
  }
  button:hover{border-color:var(--ochre)}
  button:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
  button.hot{background:var(--vermilion);border-color:var(--vermilion);color:#fff}
  button.calm{background:var(--tile);color:var(--ink);border-color:var(--tile)}
  .msg{font-size:12.5px;color:var(--dim);min-height:18px;margin-top:10px;line-height:1.5}
  .msg b{color:var(--ochre)}

  /* ── 결과 ── */
  .over{
    position:fixed;inset:0;z-index:50;display:grid;place-items:center;
    background:rgba(6,20,15,.86);padding:20px
  }
  .panel{
    background:var(--mat);border:1px solid var(--mat-line);border-radius:11px;
    padding:22px;max-width:340px;width:100%;text-align:center
  }
  .panel h2{margin:0 0 4px;font-size:15px;letter-spacing:.1em;color:var(--dim);font-weight:600}
  .panel .big{font-family:var(--mono);font-size:44px;font-weight:800;color:var(--ochre);line-height:1}
  .panel .tags{font-size:12.5px;color:var(--dim);margin:8px 0 18px;word-break:keep-all}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  @media (max-width:420px){.card{width:50px;height:75px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="brand">고<em>스톱</em></div>
    <div class="stat">더미 <b id="deckN">0</b>장 · 판 <b id="seedN">-</b></div>
  </div>

  <div class="side" id="sideAi">
    <span class="who">상대</span>
    <span class="pts" id="aiPts">0</span>
    <span class="tally" id="aiTally"></span>
  </div>

  <p class="field-label">바닥</p>
  <div class="field" id="field"></div>

  <div class="side" id="sideMe" style="margin-top:12px">
    <span class="who">나</span>
    <span class="pts" id="mePts">0</span>
    <span class="tally" id="meTally"></span>
  </div>

  <div class="hand" id="hand"></div>

  <div class="row" id="controls"></div>
  <p class="msg" id="msg">패를 골라 내세요.</p>
</div>

<script>
// 룰 엔진 JS 포팅. engine.py / scoring.py / cards.py 와 동작이 일치해야 한다.
// 규칙을 고칠 때는 반드시 양쪽을 함께 수정할 것.

const GWANG = 'gwang', YEOL = 'yeol', TTI = 'tti', PI = 'pi';
const HONG = 'hong', CHO = 'cho', CHUNG = 'chung', PLAIN = 'plain';
const GO_THRESHOLD = 7;

const RAW = [
  [1, GWANG, '송학 광', 0, null, false, false],
  [1, TTI, '홍단', 0, HONG, false, false],
  [1, PI, '피', 1, null, false, false],
  [1, PI, '피', 1, null, false, false],
  [2, YEOL, '꾀꼬리', 0, null, false, true],
  [2, TTI, '홍단', 0, HONG, false, false],
  [2, PI, '피', 1, null, false, false],
  [2, PI, '피', 1, null, false, false],
  [3, GWANG, '벚꽃 광', 0, null, false, false],
  [3, TTI, '홍단', 0, HONG, false, false],
  [3, PI, '피', 1, null, false, false],
  [3, PI, '피', 1, null, false, false],
  [4, YEOL, '두견새', 0, null, false, true],
  [4, TTI, '초단', 0, CHO, false, false],
  [4, PI, '피', 1, null, false, false],
  [4, PI, '피', 1, null, false, false],
  [5, YEOL, '다리', 0, null, false, false],
  [5, TTI, '초단', 0, CHO, false, false],
  [5, PI, '피', 1, null, false, false],
  [5, PI, '피', 1, null, false, false],
  [6, YEOL, '나비', 0, null, false, false],
  [6, TTI, '청단', 0, CHUNG, false, false],
  [6, PI, '피', 1, null, false, false],
  [6, PI, '피', 1, null, false, false],
  [7, YEOL, '멧돼지', 0, null, false, false],
  [7, TTI, '초단', 0, CHO, false, false],
  [7, PI, '피', 1, null, false, false],
  [7, PI, '피', 1, null, false, false],
  [8, GWANG, '공산 광', 0, null, false, false],
  [8, YEOL, '기러기', 0, null, false, true],
  [8, PI, '피', 1, null, false, false],
  [8, PI, '피', 1, null, false, false],
  [9, YEOL, '국진', 0, null, false, false],
  [9, TTI, '청단', 0, CHUNG, false, false],
  [9, PI, '피', 1, null, false, false],
  [9, PI, '피', 1, null, false, false],
  [10, YEOL, '사슴', 0, null, false, false],
  [10, TTI, '청단', 0, CHUNG, false, false],
  [10, PI, '피', 1, null, false, false],
  [10, PI, '피', 1, null, false, false],
  [11, GWANG, '오동 광', 0, null, false, false],
  [11, PI, '쌍피', 2, null, false, false],
  [11, PI, '피', 1, null, false, false],
  [11, PI, '피', 1, null, false, false],
  [12, GWANG, '비광', 0, null, true, false],
  [12, YEOL, '제비', 0, null, true, false],
  [12, TTI, '비띠', 0, PLAIN, true, false],
  [12, PI, '쌍피', 2, null, true, false],
];

const DECK = RAW.map(([month, kind, name, pi, tti, rain, godori], i) => ({
  month, kind, name, pi, tti, rain, godori, uid: i + 1,
}));

// 시드 고정 PRNG. 같은 시드는 같은 판을 만든다.
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function baseScore(cards) {
  const gwangs = cards.filter((c) => c.kind === GWANG);
  const yeols = cards.filter((c) => c.kind === YEOL);
  const ttis = cards.filter((c) => c.kind === TTI);
  const piPoints = cards.reduce((s, c) => s + c.pi, 0);

  let gwang = 0;
  if (gwangs.length === 5) gwang = 15;
  else if (gwangs.length === 4) gwang = 4;
  else if (gwangs.length === 3) gwang = gwangs.some((c) => c.rain) ? 2 : 3;

  const yeol = yeols.length >= 5 ? yeols.length - 4 : 0;
  const godori = yeols.filter((c) => c.godori).length === 3 ? 5 : 0;
  const tti = ttis.length >= 5 ? ttis.length - 4 : 0;
  const nColor = (c) => ttis.filter((x) => x.tti === c).length;
  const hongdan = nColor(HONG) === 3 ? 3 : 0;
  const chodan = nColor(CHO) === 3 ? 3 : 0;
  const chungdan = nColor(CHUNG) === 3 ? 3 : 0;
  const pi = piPoints >= 10 ? piPoints - 9 : 0;

  return {
    gwang, yeol, godori, tti, hongdan, chodan, chungdan, pi,
    nGwang: gwangs.length, nYeol: yeols.length, nTti: ttis.length, piPoints,
    total: gwang + yeol + godori + tti + hongdan + chodan + chungdan + pi,
  };
}

function goAdjust(goCount) {
  if (goCount <= 0) return [0, 1];
  return [goCount === 1 ? 1 : 2, 2 ** Math.max(0, goCount - 2)];
}

function settle(winnerCards, loserCards, { goCount = 0, shake = 0, loserWentGo = false } = {}) {
  const b = baseScore(winnerCards);
  const lb = baseScore(loserCards);
  const [bonus, goMult] = goAdjust(goCount);
  const gwangbak = b.nGwang >= 3 && lb.nGwang === 0;
  const pibak = b.pi > 0 && lb.piPoints < 7;
  const meongbak = b.nYeol >= 7 && lb.nYeol === 0;

  let mult = goMult;
  for (const f of [gwangbak, pibak, meongbak, loserWentGo]) if (f) mult *= 2;
  mult *= 2 ** shake;

  return {
    base: b.total, total: (b.total + bonus) * mult, multiplier: mult,
    gwangbak, pibak, meongbak, gobak: loserWentGo, goCount, shake,
  };
}

class Engine {
  constructor(seed = Math.floor(Math.random() * 1e9)) {
    this.rand = mulberry32(seed);
    this.players = [0, 1].map((i) => ({
      index: i, hand: [], captured: [], goCount: 0, shake: 0, lastGoScore: 0,
    }));
    this.field = [];
    this.deck = [];
    this.turn = 0;
    this.finished = false;
    this.settlement = null;
    this.winner = null;
    this.ppeokOwner = {};
    this.deal();
  }

  deal() {
    const deck = DECK.slice();
    for (let i = deck.length - 1; i > 0; i--) {
      const j = Math.floor(this.rand() * (i + 1));
      [deck[i], deck[j]] = [deck[j], deck[i]];
    }
    for (const p of this.players) {
      p.hand = deck.splice(0, 10).sort((a, b) => a.month - b.month || a.uid - b.uid);
    }
    this.field = deck.splice(0, 8);
    this.deck = deck;
  }

  get current() { return this.players[this.turn]; }
  get opponent() { return this.players[1 - this.turn]; }
  fieldMatches(month) { return this.field.filter((c) => c.month === month); }
  score(i) { return baseScore(this.players[i].captured).total; }

  bombable() {
    const hand = this.current.hand;
    const months = new Set();
    for (let m = 1; m <= 12; m++) {
      if (hand.filter((c) => c.month === m).length === 3 && this.fieldMatches(m).length === 1) {
        months.add(m);
      }
    }
    return [...months];
  }

  _pull(card) {
    const i = this.field.findIndex((c) => c.uid === card.uid);
    if (i >= 0) this.field.splice(i, 1);
  }

  _take(p, cards, res) {
    for (const c of cards) this._pull(c);
    p.captured.push(...cards);
    res.captured.push(...cards);
  }

  _steal(res) {
    const victim = this.opponent;
    const pool = victim.captured.filter((c) => c.kind === PI).sort((a, b) => a.pi - b.pi);
    if (!pool.length) return;
    const card = pool[0];
    victim.captured.splice(victim.captured.findIndex((c) => c.uid === card.uid), 1);
    this.current.captured.push(card);
    res.events.push('STEAL');
  }

  _resolvePending(p, pending, res) {
    if (pending.length) {
      this._take(p, pending, res);
      delete this.ppeokOwner[pending[0].month];
    }
  }

  bomb(month) {
    const p = this.current;
    const res = { player: p.index, played: null, flipped: null, captured: [], events: ['BOMB', 'SHAKE'], pendingGo: false };
    const cards = p.hand.filter((c) => c.month === month);
    p.hand = p.hand.filter((c) => c.month !== month);
    this._take(p, this.fieldMatches(month).concat(cards), res);
    p.shake += 1;
    this._steal(res);
    this._maybeGo(res);
    return res;
  }

  play(card, choice = 0, flipChoice = 0) {
    const p = this.current;
    const res = { player: p.index, played: card, flipped: null, captured: [], events: [], pendingGo: false };
    p.hand = p.hand.filter((c) => c.uid !== card.uid);

    const matches = this.fieldMatches(card.month);
    let handLanded = false;
    let pending = [];

    if (matches.length === 0) {
      this.field.push(card);
      handLanded = true;
    } else if (matches.length <= 2) {
      const picked = matches.length === 2 ? matches[choice] : matches[0];
      this._pull(picked);
      pending = [card, picked];
    } else {
      this._take(p, matches.concat([card]), res);
      delete this.ppeokOwner[card.month];
    }

    const flipped = this.deck.length ? this.deck.pop() : null;
    res.flipped = flipped;
    if (!flipped) {
      this._resolvePending(p, pending, res);
      return this._endTurn(res);
    }

    const fMatches = this.fieldMatches(flipped.month);

    if (flipped.month === card.month) {
      if (handLanded) {
        this._pull(card);
        this._take(p, [flipped, card], res);
        res.events.push('JJOK');
        this._steal(res);
      } else if (pending.length) {
        const remaining = this.fieldMatches(card.month);
        if (remaining.length) {
          this._take(p, remaining.concat(pending, [flipped]), res);
        } else {
          this.field.push(...pending, flipped);
          this.ppeokOwner[card.month] = p.index;
          res.events.push('PPEOK');
        }
        pending = [];
      } else {
        this._take(p, [flipped], res);
      }
    } else {
      const handPair = pending.length === 2;
      this._resolvePending(p, pending, res);
      pending = [];
      if (fMatches.length === 0) {
        this.field.push(flipped);
      } else if (fMatches.length === 1) {
        this._take(p, [flipped, fMatches[0]], res);
        if (handPair) { res.events.push('TTADAK'); this._steal(res); }
      } else if (fMatches.length === 2) {
        this._take(p, [flipped, fMatches[flipChoice]], res);
      } else {
        this._take(p, fMatches.concat([flipped]), res);
        delete this.ppeokOwner[flipped.month];
      }
    }

    this._resolvePending(p, pending, res);

    if (this.field.length === 0 && res.captured.length) {
      res.events.push('SSAKSSULI');
      this._steal(res);
    }
    return this._endTurn(res);
  }

  _maybeGo(res) {
    const p = this.current;
    const s = this.score(p.index);
    if (s >= GO_THRESHOLD && s > p.lastGoScore) res.pendingGo = true;
    return res;
  }

  _endTurn(res) {
    const p = this.current;
    this._maybeGo(res);
    if (res.pendingGo) return res;
    if (!p.hand.length && !this.deck.length) this._finishDraw();
    else this.turn = 1 - this.turn;
    return res;
  }

  declare(go) {
    const p = this.current;
    const res = { player: p.index, played: null, flipped: null, captured: [], events: [], pendingGo: false };
    if (go) {
      p.goCount += 1;
      p.lastGoScore = this.score(p.index);
      res.events.push('GO');
      if (!p.hand.length && !this.deck.length) this._finishDraw();
      else this.turn = 1 - this.turn;
    } else {
      res.events.push('STOP');
      this._finish(p.index);
    }
    return res;
  }

  _finish(winner) {
    const w = this.players[winner];
    const l = this.players[1 - winner];
    this.settlement = settle(w.captured, l.captured, {
      goCount: w.goCount, shake: w.shake + l.shake, loserWentGo: l.goCount > 0,
    });
    this.winner = winner;
    this.finished = true;
  }

  _finishDraw() { this.settlement = null; this.winner = null; this.finished = true; }
}

// 한 수 앞만 보는 기준선 정책 (ai.py의 GreedyPolicy와 동일한 가중치)
const KIND_WEIGHT = { [GWANG]: 8, [YEOL]: 3, [TTI]: 3, [PI]: 1 };
function cardValue(c) {
  let v = KIND_WEIGHT[c.kind];
  if (c.kind === PI) v *= c.pi;
  if (c.godori) v += 2;
  if (c.tti && c.tti !== PLAIN) v += 1.5;
  return v;
}

function chooseCard(engine) {
  let best = null;
  for (const card of engine.current.hand) {
    const m = engine.fieldMatches(card.month);
    let cand;
    if (m.length === 0) cand = [-cardValue(card) * 0.3, card, 0];
    else if (m.length === 1) cand = [cardValue(m[0]) + cardValue(card) * 0.1, card, 0];
    else if (m.length === 2) {
      const pick = cardValue(m[0]) >= cardValue(m[1]) ? 0 : 1;
      cand = [cardValue(m[pick]), card, pick];
    } else cand = [m.reduce((s, c) => s + cardValue(c), 0), card, 0];
    if (!best || cand[0] > best[0]) best = cand;
  }
  return best;
}

function chooseGo(engine) {
  const me = engine.current;
  if (baseScore(engine.opponent.captured).total >= 5) return false;
  if (engine.score(me.index) >= 10) return false;
  return me.hand.length >= 3;
}

// 화투 48장 도안. 목판화 느낌을 노려 평면 색면 + 굵은 먹선으로 단순화했다.
// 월별 식물 모티프를 바탕에 깔고, 광/열끗/띠 요소를 그 위에 얹는다.
// 전부 직접 그린 벡터라 외부 이미지 의존이 없다.

const PAPER = '#f3ead7';
const INK = '#17130f';

// ── 월별 바탕 식물 ──────────────────────────────────────────────
const PLANT = {

const TTI_FILL = { hong: '#c4372b', chung: '#2a4a8c', cho: '#a8322a', plain: '#a8322a' };

function ttiArt(card) {
  const fill = TTI_FILL[card.tti] || '#a8322a';
  const glyph = card.tti === 'hong' ? '<path d="M34 32 h14 M34 38 h14 M41 26 v18" stroke="#f3ead7" stroke-width="2"/>'
    : card.tti === 'chung' ? '<path d="M34 30 h14 v10 h-14Z" fill="none" stroke="#f3ead7" stroke-width="2"/>'
    : '';
  return `<path d="M24 22 h34 v24 h-34Z" fill="${fill}"/>${glyph}
          <path d="M24 22 h34 v24 h-34Z" fill="none" stroke="${INK}" stroke-width="1.2"/>`;
}

// ── 조립 ──────────────────────────────────────────────────────
function cardArt(card) {
  const layers = [`<rect x="0" y="0" width="60" height="90" rx="4" fill="${PAPER}"/>`];
  layers.push(`<g opacity="${card.kind === 'pi' ? '1' : '.9'}">${PLANT[card.month] || ''}</g>`);

  if (card.kind === 'gwang') {
    layers.push(GWANG_ART[card.month] || '');
    layers.push(`<circle cx="49" cy="79" r="8" fill="#c4372b"/>
                 <text x="49" y="83" text-anchor="middle" font-size="10" font-weight="700" fill="${PAPER}">光</text>`);
  } else if (card.kind === 'yeol') {
    layers.push(YEOL_ART[card.month] || '');
  } else if (card.kind === 'tti') {
    layers.push(ttiArt(card));
  } else if (card.pi === 2) {
    layers.push(`<path d="M30 30 h22 v22 h-22Z" fill="#b9ab8c" opacity=".5"/>
                 <text x="41" y="46" text-anchor="middle" font-size="14" font-weight="800" fill="${INK}">雙</text>`);
  }

  layers.push(`<text x="6" y="15" font-size="11" font-weight="700"
                 font-family="ui-monospace,monospace" fill="${INK}">${card.month}</text>`);
  layers.push(`<rect x="1" y="1" width="58" height="88" rx="4" fill="none"
                 stroke="${INK}" stroke-width="2"/>`);

  return `<svg viewBox="0 0 60 90" xmlns="http://www.w3.org/2000/svg" role="img"
            aria-label="${card.month}월 ${card.name}">${layers.join('')}</svg>`;
}

const $ = (id) => document.getElementById(id);
const SEAL = { PPEOK:'뻑', JJOK:'쪽', TTADAK:'따닥', SSAKSSULI:'싹쓸이', BOMB:'폭탄' };
const KIND_KR = { gwang:'광', yeol:'열', tti:'띠', pi:'피' };

let game, seed, mode = 'play', pendingCard = null, busy = false;

function newGame(s) {
  seed = s ?? Math.floor(Math.random() * 100000);
  game = new Engine(seed);
  mode = 'play'; pendingCard = null; busy = false;
  say('패를 골라 내세요.');
  render();
}

function cardEl(c, opts = {}) {
  const el = document.createElement('div');
  el.className = 'card' + (opts.cls ? ' ' + opts.cls : '');
  el.dataset.k = c.kind;
  if (c.tti) el.dataset.t = c.tti;
  el.innerHTML = cardArt(c);
  return el;
}

function tally(idx) {
  const b = baseScore(game.players[idx].captured);
  return `<span>광 <b>${b.nGwang}</b></span><span>열 <b>${b.nYeol}</b></span>` +
         `<span>띠 <b>${b.nTti}</b></span><span>피 <b>${b.piPoints}</b></span>`;
}

function render() {
  $('deckN').textContent = game.deck.length;
  $('seedN').textContent = seed;
  $('aiPts').textContent = game.score(1);
  $('mePts').textContent = game.score(0);
  $('aiTally').innerHTML = tally(1);
  $('meTally').innerHTML = tally(0);
  $('sideMe').classList.toggle('active', game.turn === 0 && !game.finished);
  $('sideAi').classList.toggle('active', game.turn === 1 && !game.finished);

  const field = $('field');
  field.innerHTML = '';
  const pickMonth = mode === 'choose' ? pendingCard.month : null;
  for (const c of game.field) {
    const el = cardEl(c);
    if (c.month === pickMonth) {
      el.classList.add('pick');
      el.tabIndex = 0;
      el.setAttribute('role', 'button');
      el.setAttribute('aria-label', `${c.month}월 ${c.name} 먹기`);
      const pick = () => resolveChoice(c);
      el.onclick = pick;
      el.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } };
    }
    field.appendChild(el);
  }

  const hand = $('hand');
  hand.innerHTML = '';
  for (const c of game.players[0].hand) {
    const n = game.fieldMatches(c.month).length;
    const el = cardEl(c, { cls: n ? 'hint' : '' });
    el.tabIndex = 0;
    el.setAttribute('role', 'button');
    el.setAttribute('aria-label', `${c.month}월 ${c.name}${n ? `, 바닥 ${n}장` : ''}`);
    const go = () => humanPlay(c);
    el.onclick = go;
    el.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } };
    hand.appendChild(el);
  }

  const ctl = $('controls');
  ctl.innerHTML = '';
  if (game.turn === 0 && !game.finished && mode === 'play' && !busy) {
    for (const m of game.bombable()) {
      ctl.appendChild(btn(`${m}월 폭탄`, 'hot', () => { stamp('BOMB'); after(game.bomb(m)); }));
    }
  }
  ctl.appendChild(btn('새 판', '', () => newGame()));
}

function btn(label, cls, fn) {
  const b = document.createElement('button');
  b.textContent = label;
  if (cls) b.className = cls;
  b.onclick = fn;
  return b;
}

function say(html) { $('msg').innerHTML = html; }

function stamp(evt) {
  const text = SEAL[evt];
  if (!text) return;
  const el = document.createElement('div');
  el.className = 'seal';
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 700);
}

function describe(res, who) {
  const bits = [];
  if (res.played) bits.push(`${res.played.month}월 ${res.played.name}`);
  if (res.flipped) bits.push(`뒤집기 ${res.flipped.month}월 ${res.flipped.name}`);
  if (res.captured.length) bits.push(`<b>${res.captured.length}장</b> 획득`);
  const seals = res.events.filter((e) => SEAL[e]).map((e) => SEAL[e]);
  if (res.events.includes('STEAL')) seals.push('상대 피 1장');
  return `${who} — ${bits.join(', ')}${seals.length ? ' · ' + seals.join(' ') : ''}`;
}

function humanPlay(card) {
  if (busy || game.finished || game.turn !== 0) return;
  if (mode === 'choose') return;
  if (game.fieldMatches(card.month).length === 2) {
    pendingCard = card; mode = 'choose';
    say('바닥에 같은 월이 두 장입니다. 가져갈 패를 고르세요.');
    render();
    return;
  }
  commit(card, 0);
}

function resolveChoice(target) {
  const m = game.fieldMatches(pendingCard.month);
  const idx = m.findIndex((c) => c.uid === target.uid);
  const card = pendingCard;
  pendingCard = null; mode = 'play';
  commit(card, idx < 0 ? 0 : idx);
}

function commit(card, choice) {
  const res = game.play(card, choice);
  for (const e of res.events) stamp(e);
  say(describe(res, '나'));
  after(res);
}

function after(res) {
  render();
  if (res.pendingGo) { askGo(); return; }
  if (game.finished) { finish(); return; }
  if (game.turn === 1) { busy = true; setTimeout(aiTurn, 750); }
}

function askGo() {
  const ctl = $('controls');
  ctl.innerHTML = '';
  say(`현재 <b>${game.score(0)}점</b>. 고를 부르면 점수가 오르지만, 상대가 먼저 나면 고박입니다.`);
  ctl.appendChild(btn('고', 'hot', () => { const r = game.declare(true); say('고!'); after(r); }));
  ctl.appendChild(btn('스톱', 'calm', () => { const r = game.declare(false); after(r); }));
}

function aiTurn() {
  if (game.finished) { busy = false; finish(); return; }
  if (!game.current.hand.length) {
    game.turn = 0;
    if (!game.current.hand.length && !game.deck.length) game._finishDraw();
    busy = false; render();
    if (game.finished) finish();
    return;
  }
  const [, card, ch] = chooseCard(game);
  let res = game.play(card, ch);
  for (const e of res.events) stamp(e);
  say(describe(res, '상대'));
  while (res.pendingGo) {
    const go = chooseGo(game);
    res = game.declare(go);
    say(go ? '상대가 <b>고</b>를 불렀습니다.' : '상대가 <b>스톱</b>했습니다.');
  }
  busy = false;
  render();
  if (game.finished) { finish(); return; }
  if (game.turn === 1) { busy = true; setTimeout(aiTurn, 750); }
}

function finish() {
  const s = game.settlement;
  const over = document.createElement('div');
  over.className = 'over';
  const panel = document.createElement('div');
  panel.className = 'panel';

  if (game.winner === null) {
    panel.innerHTML = '<h2>결과</h2><div class="big">나가리</div>' +
      '<p class="tags">양쪽 다 패가 떨어졌습니다.</p>';
  } else {
    const tags = [];
    if (s.goCount) tags.push(`${s.goCount}고`);
    if (s.gwangbak) tags.push('광박');
    if (s.pibak) tags.push('피박');
    if (s.meongbak) tags.push('멍박');
    if (s.gobak) tags.push('고박');
    if (s.shake) tags.push(`흔들기 ×${2 ** s.shake}`);
    panel.innerHTML = `<h2>${game.winner === 0 ? '내가 이겼습니다' : '상대가 이겼습니다'}</h2>` +
      `<div class="big">${s.total}</div>` +
      `<p class="tags">기본 ${s.base}점${tags.length ? ' · ' + tags.join(' · ') : ''}</p>`;
  }
  const again = btn('한 판 더', 'calm', () => { over.remove(); newGame(); });
  panel.appendChild(again);
  over.appendChild(panel);
  document.body.appendChild(over);
  again.focus();
}

newGame();
</script>
